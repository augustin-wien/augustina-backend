parent=keycloak
import=common/keycloak

# keycloak's own login.css keeps the layout of every page (forms, OTP,
# WebAuthn …) working; augustin.css on top gives it the Augustin look.
styles=css/login.css css/augustin.css
scripts=js/sentry-report.js

# Sentry/GlitchTip DSN for error pages (empty = off).  Keycloak resolves
# ${env.…} in theme.properties; sentry-report.js reads the meta tags.
meta=viewport==width=device-width,initial-scale=1,viewport-fit=cover theme-color==#ffffff augustin-sentry-dsn==${env.KC_SENTRY_DSN:} augustin-sentry-env==${env.KC_SENTRY_ENVIRONMENT:production}

kcLogoLink=https://augustin.or.at
