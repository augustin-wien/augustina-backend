services:
  augustin-frontend:
    build:
      context: ./docker/augustin-frontend
    ports:
      - "8060:80"
    environment:
      VITE_API_URL: ${BACKEND_HOST}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
    depends_on:
      - augustin
  augustin:
    container_name: augustin
    env_file:
      - .env
    build:
      context: .
    volumes:
      - ./app:/app
      - ./email_templates:/app/templates
    command: >
        sh -c 'tern migrate --migrations ./migrations --config ./migrations/tern.conf &&
        tern migrate --migrations ./migrations --config ./migrations/tern_test.conf &&
        go run main.go'

    environment:
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_HOST_TEST: ${DB_HOST_TEST}
      DB_PORT_TEST: ${DB_PORT_TEST}
      DEVELOPMENT: true
      DEBUG_payments: ${DEBUG_payments}
      FRONTEND_URL: ${FRONTEND_URL}
      VIVA_WALLET_SOURCE_CODE: ${VIVA_WALLET_SOURCE_CODE}
      VIVA_WALLET_SMART_CHECKOUT_CLIENT_ID: ${VIVA_WALLET_SMART_CHECKOUT_CLIENT_ID}
      VIVA_WALLET_SMART_CHECKOUT_CLIENT_KEY: ${VIVA_WALLET_SMART_CHECKOUT_CLIENT_KEY}
      VIVA_WALLET_VERIFICATION_KEY: ${VIVA_WALLET_VERIFICATION_KEY}
      VIVA_WALLET_API_URL: ${VIVA_WALLET_API_URL}
      VIVA_WALLET_ACCOUNTS_URL: ${VIVA_WALLET_ACCOUNTS_URL}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_SENDER_ADDRESS: ${SMTP_SENDER_ADDRESS}
      SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      BACKEND_HOST: ${BACKEND_HOST}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SENTRY_DSN: ${SENTRY_DSN}
      FLOUR_WEBHOOK_URL: ${FLOUR_WEBHOOK_URL}
      FLOUR_WEBHOOK_TOKEN: ${FLOUR_WEBHOOK_TOKEN}
      ODOO_WEBHOOK_URL: ${ODOO_WEBHOOK_URL}
      ODOO_WEBHOOK_TOKEN: ${ODOO_WEBHOOK_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      augustin-db:
        condition: service_healthy
    links:
      - augustin-db
      - augustin-db-test
      - keycloak
      - webhook-receiver
      - mailpit
    ports:
      - "3000:3000"
    healthcheck:
      test: curl -f "$BACKEND_HOST/api/hello/" || exit 1
      interval: 60s   # check every minute
      timeout: 20s    # maximum time to wait for a response
      retries: 3      # number of retries before considering the container unhealthy
      start_period: 2m
  augustin-db:
    container_name: augustin-db
    image: postgres:15
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      TZ: "UTC"
      PGTZ: "UTC"
    command: -p ${DB_PORT}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  augustin-db-test:
    container_name: augustin-db-test
    image: postgres:16.0
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      TZ: "UTC"
      PGTZ: "UTC"
    command: -p ${DB_PORT_TEST}
    ports:
      - "${DB_PORT_TEST}:${DB_PORT_TEST}"
    volumes:
      - dbdata-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    build: ./docker/keycloak
    container_name: augustin-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_FRONTEND_URL: ${KEYCLOAK_HOST}
      ROOT_LOGLEVEL: ALL
      KEYCLOAK_LOGLEVEL: DEBUG
      KC_HOSTNAME: ${KEYCLOAK_HOST}
      KC_PROXY_HEADERS: xforwarded
      KC_FRONTEND_URL: ${KEYCLOAK_HOST}
      KC_HOSTNAME_STRICT_BACKCHANNEL: true
      KC_PROXY: edge
      KC_HTTP_ENABLED: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/realms/master"]
      interval: 5s
      timeout: 2s
      retries: 15
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
      - ./docker/keycloak/export:/tmp/export
      - ./docker/keycloak/themes/augustin:/opt/keycloak/themes/augustin:ro
      - ./docker/keycloak/themes/hempels:/opt/keycloak/themes/hempels:ro

    command: start-dev --import-realm
    ports:
      - "8080:8080"
    links:
      - mailpit
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP
    restart: unless-stopped

  webhook-receiver:
    build:
      context: ./docker/webhook-receiver
    container_name: webhook-receiver
    ports:
      - "8081:8080"
    volumes:
      - ./webhook-logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Matomo for testing the optional analytics integration. Nothing depends on it — the frontend
  # only tracks once MatomoUrl and MatomoSiteId are filled in under Backoffice > Settings.
  # matomo-init installs it unattended, so there is no installer to click through.
  matomo-db:
    image: mariadb:11
    container_name: matomo-db
    command: --max-allowed-packet=64MB
    environment:
      - MARIADB_DATABASE=${MATOMO_DB_NAME:-matomo}
      - MARIADB_USER=${MATOMO_DB_USER:-matomo}
      - MARIADB_PASSWORD=${MATOMO_DB_PASSWORD:-password}
      - MARIADB_ROOT_PASSWORD=${MATOMO_DB_ROOT_PASSWORD:-password}
    volumes:
      - matomo_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  matomo:
    image: matomo:5-apache
    container_name: matomo
    ports:
      - "8092:80"
    environment:
      - MATOMO_DATABASE_HOST=matomo-db
      - MATOMO_DATABASE_ADAPTER=mysql
      - MATOMO_DATABASE_USERNAME=${MATOMO_DB_USER:-matomo}
      - MATOMO_DATABASE_PASSWORD=${MATOMO_DB_PASSWORD:-password}
      - MATOMO_DATABASE_DBNAME=${MATOMO_DB_NAME:-matomo}
    volumes:
      - matomo_data:/var/www/html
    depends_on:
      matomo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost/index.php"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Walks the Matomo web installer once, then exits. Idempotent: on an already installed
  # instance it does nothing.
  matomo-init:
    image: curlimages/curl:latest
    container_name: matomo-init
    user: 0:0
    entrypoint: ["sh", "/matomo-init/entrypoint.sh"]
    volumes:
      - ./docker/matomo-init/:/matomo-init/
      # Needed to add the browser-facing host to trusted_hosts after the install.
      - matomo_data:/var/www/html
    environment:
      - MATOMO_URL=http://matomo
      - MATOMO_URL_EXTERNAL=http://localhost:8092
      - MATOMO_DATABASE_HOST=matomo-db
      - MATOMO_DATABASE_USERNAME=${MATOMO_DB_USER:-matomo}
      - MATOMO_DATABASE_PASSWORD=${MATOMO_DB_PASSWORD:-password}
      - MATOMO_DATABASE_DBNAME=${MATOMO_DB_NAME:-matomo}
      - MATOMO_ADMIN_USER=${MATOMO_ADMIN_USER:-admin}
      - MATOMO_ADMIN_PASSWORD=${MATOMO_ADMIN_PASSWORD:-Test123!matomo}
      - MATOMO_ADMIN_EMAIL=${MATOMO_ADMIN_EMAIL:-admin@example.com}
      - MATOMO_SITE_NAME=${MATOMO_SITE_NAME:-Augustin}
      - MATOMO_SITE_URL=${MATOMO_SITE_URL:-http://localhost:5173}
      - MATOMO_SITE_TIMEZONE=${MATOMO_SITE_TIMEZONE:-Europe/Vienna}
    depends_on:
      matomo:
        condition: service_healthy
    restart: "no"

volumes:
  dbdata:
  wp_data:
  wp_db_data:
  dbdata-test:
  webhook-logs:
  matomo_data:
  matomo_db_data:
