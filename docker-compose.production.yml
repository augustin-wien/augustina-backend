services:
  augustin-backend:
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./Dockerfile.production
    image: dkia/augustin-backend
    volumes:
      - /dockerstorage/convive/augustin/data/backend/img:/app/img
      - /dockerstorage/convive/augustin/data/backend/pdf:/app/pdf
      - /dockerstorage/convive/augustin/data/backend/email_templates:/app/templates

    environment:
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_HOST_TEST: ${DB_HOST_TEST}
      DB_PORT_TEST: ${DB_PORT_TEST}
      DEVELOPMENT: ${DEVELOPMENT}
      FRONTEND_URL: ${FRONTEND_URL}
    depends_on:
      - augustin-db
    links:
      - augustin-db
      - keycloak
    ports:
      - "7001:3000"
  augustin-frontend:
    build:
      context: ./docker/augustin-frontend
    image: dkia/augustin-frontend
    ports:
      - "7002:80"
    environment:
      VITE_API_URL: ${BACKEND_HOST}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}

  augustin-db:
    image: postgres:15.0
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      TZ: "UTC"
      PGTZ: "UTC"
    command: -p ${DB_PORT}
    volumes:
      - /dockerstorage/convive/augustin-backend/dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "7005:5432"
  pgbackups-augustin-db-cluster:
    image: prodrigestivill/postgres-backup-local
    restart: always
    volumes:
        - /dockerstorage/convive/augustin-db-cluster-backups:/backups
    depends_on:
      - augustin-db
    environment:
        - POSTGRES_HOST=${DB_BACKUP_HOST}
        - POSTGRES_PORT=7005
        - POSTGRES_DB=${DB_NAME}
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASS}
        - POSTGRES_CLUSTER=TRUE
        - POSTGRES_EXTRA_OPTS=--clean --if-exists
        - SCHEDULE=@every 1h
        - BACKUP_KEEP_MINS=1500
        - BACKUP_KEEP_DAYS=7
        - BACKUP_KEEP_WEEKS=4
        - BACKUP_KEEP_MONTHS=6
        - HEALTHCHECK_PORT=8080

  keycloak:
    build:
      context: ./docker/keycloak
      dockerfile: ./Dockerfile.production
    image: dkia/augustin-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_FRONTEND_URL: ${KEYCLOAK_HOST}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_DB_SCHEMA: public
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_URL_HOST: ${KEYCLOAK_DB_HOST}
      KC_DB_URL_PORT: ${KEYCLOAK_DB_PORT}
      ROOT_LOGLEVEL: ALL
      KEYCLOAK_LOGLEVEL: DEBUG
      #KC_HOSTNAME_URL: ${KEYCLOAK_HOST}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: ${KEYCLOAK_HOST}
      # KC_PROXY=edge / KC_PROXY_ADDRESS_FORWARDING were removed in Keycloak 26;
      # this pair is their replacement.
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_FRONTEND_URL: ${KEYCLOAK_HOST}
      KC_HOSTNAME_STRICT_BACKCHANNEL: "true"

    depends_on:
      - keycloak-db
    volumes:
      - /dockerstorage/convive/augustin-backend/docker/keycloak/import:/opt/keycloak/data/import
      - /dockerstorage/convive/augustin-backend/docker/keycloak/export:/tmp/export
      - /dockerstorage/convive/augustin-backend/docker/keycloak/themes/augustin:/opt/keycloak/themes/augustin:ro
      - /dockerstorage/convive/augustina-keycloak-themes:/opt/keycloak/themes:ro

    ports:
      - "7000:8080"
  keycloak-db:
    image: postgres:14-alpine
    volumes:
      - /dockerstorage/convive/augustin-backend/keycloak-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
  wordpress-db:
    # We use a mariadb image which supports both amd64 & arm64 architecture
    image: mariadb:10.6.4-focal
    # If you really want to use MySQL, uncomment the following line
    #image: mysql:8.0.27
    command: "--default-authentication-plugin=mysql_native_password"
    volumes:
      - /dockerstorage/convive/augustin-backend/wp_db_data:/var/lib/mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - MYSQL_DATABASE=${WORDPRESS_DB_NAME}
      - MYSQL_USER=${WORDPRESS_DB_USER}
      - MYSQL_PASSWORD=${WORDPRESS_DB_PASSWORD}
  # WordPress is on mariadb, which the postgres image cannot dump. With no
  # MYSQL_DATABASE set this one dumps every database it can see, one file each,
  # so it needs the root credentials of the wordpress-db service.
  mysqlbackups-wordpress-db:
    image: fradelg/mysql-cron-backup
    restart: always
    volumes:
      - /dockerstorage/convive/wordpress-db-backups:/backup
    depends_on:
      - wordpress-db
    environment:
      - MYSQL_HOST=wordpress-db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASS=${WORDPRESS_DB_PASSWORD}
      - MAX_BACKUPS=48
      - INIT_BACKUP=1
      - CRON_TIME=0 * * * *
      - GZIP_LEVEL=9

volumes:
  dbdata:
  wp_data:
  wp_db_data:
  dbdata-test:
